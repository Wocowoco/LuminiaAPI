<header class="navbar">
  <a class="brand" routerLink="/map" aria-label="Luminia home">
    <img class="brand-logo" src="assets/luminia-logo.webp" alt="Luminia">
  </a>
  <span class="version" title="Site version">v{{version}}</span>

  <nav class="nav-links" aria-label="Main">
    @for (link of navLinks; track link.route) {
      <a class="nav-link" [routerLink]="link.route" routerLinkActive="active" ariaCurrentWhenActive="page">
        <i class="fa-solid {{link.icon}}" aria-hidden="true"></i>
        <span>{{link.label}}</span>
      </a>
    }
  </nav>

  <button type="button" class="menu-button" (click)="toggleMenu()"
          [attr.aria-expanded]="isMenuOpen" aria-controls="mobile-menu" aria-label="Open menu">
    <span class="menu-icon" [class.open]="isMenuOpen" aria-hidden="true">
      <span></span><span></span><span></span>
    </span>
  </button>
</header>

<!-- Mobile drawer -->
<div class="drawer-backdrop" [class.open]="isMenuOpen" (click)="closeMenu()" aria-hidden="true"></div>
<aside id="mobile-menu" class="drawer" [class.open]="isMenuOpen" [attr.aria-hidden]="!isMenuOpen" [attr.inert]="isMenuOpen ? null : ''">
  <div class="drawer-header">
    <img class="brand-logo" src="assets/luminia-logo.webp" alt="Luminia">
    <button type="button" class="drawer-close" (click)="closeMenu()" aria-label="Close menu">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
  </div>
  <nav class="drawer-links" aria-label="Main">
    @for (link of navLinks; track link.route) {
      <a class="drawer-link" [routerLink]="link.route" routerLinkActive="active" ariaCurrentWhenActive="page">
        <i class="fa-solid {{link.icon}}" aria-hidden="true"></i>
        <span>{{link.label}}</span>
      </a>
    }
  </nav>
  <div class="drawer-footer">v{{version}}</div>
</aside>
